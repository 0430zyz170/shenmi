<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美术馆 · 双重空间 · 深绿异界</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 30px;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 14px;
            transition: opacity 1s, background 0.5s;
        }
        #hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.9);
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 16px;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
            letter-spacing: 1px;
            transition: opacity 0.5s;
        }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 200;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        #controls-hint {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(200,200,200,0.8);
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
        }
        /* 走动时的轻微镜头震动（通过CSS模拟，实际由JS处理） */
    </style>
</head>
<body>
    <div id="info">🏛️ 正常美术馆 · 前台有人</div>
    <div id="hint">🖱️ 点击画作穿越</div>
    <div id="controls-hint">W/A/S/D 或 ↑/←/↓/→ 移动 · 鼠标拖动环顾</div>
    <div class="crosshair"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 8); // 第一视角高度

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.shadowMap.bias = 0.0001;
        document.body.appendChild(renderer.domElement);

        // CSS2渲染器用于标签
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // 控制器 - 第一视角，但我们会手动控制移动
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.7, 0);
        controls.enableZoom = true;
        controls.zoomSpeed = 0.8;
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 0.5;
        controls.maxDistance = 5;
        controls.rotateSpeed = 0.5;
        // 不自动更新，我们手动更新target以支持移动
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.update();

        // --- 灯光 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        dirLight.position.set(5, 12, 8);
        dirLight.castShadow = true;
        dirLight.receiveShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 15;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 30;
        scene.add(dirLight);

        const fillLight = new THREE.PointLight(0xccddff, 0.5);
        fillLight.position.set(-3, 5, 5);
        scene.add(fillLight);

        const cornerLight1 = new THREE.PointLight(0xffaa88, 0.4);
        cornerLight1.position.set(6, 4, -6);
        scene.add(cornerLight1);

        const ceilingLightPositions = [
            [-5, 5.8, -5], [5, 5.8, -5], [-5, 5.8, 5], [5, 5.8, 5], [0, 5.8, 0]
        ];
        ceilingLightPositions.forEach(pos => {
            const light = new THREE.PointLight(0xffeedd, 0.3);
            light.position.set(pos[0], pos[1], pos[2]);
            scene.add(light);
        });

        // --- 全局变量 ---
        let isTransformed = false;
        let frontDeskPerson;
        let walls = [];
        let floorMaterial, carpetMaterial;
        const originalWallColor = 0xf0f0f0;      // 正常白色
        const darkGreenColor = 0x1a3a1a;         // 深绿色
        const redColor = 0x8b1a1a;               // 红地毯
        
        const wallMeshes = [];
        const paintingMeshes = [];

        // --- 辅助函数：创建墙壁 ---
        function createWall(width, height, depth, color, position, rotationY = 0, receiveShadow = true) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7, metalness: 0.1 });
            const wall = new THREE.Mesh(geometry, material);
            wall.position.set(position[0], position[1], position[2]);
            wall.rotation.y = rotationY;
            wall.castShadow = true;
            wall.receiveShadow = receiveShadow;
            scene.add(wall);
            wallMeshes.push(wall);
            return wall;
        }

        // --- 构建美术馆 ---

        // 地板 - 浅色木地板
        const floorGeo = new THREE.BoxGeometry(20, 0.2, 30);
        floorMaterial = new THREE.MeshStandardMaterial({ color: 0xd9c8a9, roughness: 0.6, metalness: 0.1 });
        const floor = new THREE.Mesh(floorGeo, floorMaterial);
        floor.position.set(0, -0.1, 0);
        floor.receiveShadow = true;
        scene.add(floor);

        // 天花板
        const ceilingGeo = new THREE.BoxGeometry(20, 0.2, 30);
        const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
        const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
        ceiling.position.set(0, 5.9, 0);
        ceiling.receiveShadow = true;
        scene.add(ceiling);

        // 墙壁 - 四周
        // 后墙 (z = -15)
        createWall(20, 6, 0.3, originalWallColor, [0, 3, -15]);
        // 前墙 (z = 15) 分段留门
        createWall(8, 6, 0.3, originalWallColor, [-6, 3, 15]);
        createWall(8, 6, 0.3, originalWallColor, [6, 3, 15]);
        // 左墙 (x = -10)
        createWall(30, 6, 0.3, originalWallColor, [-10, 3, 0], Math.PI/2);
        // 右墙 (x = 10)
        createWall(30, 6, 0.3, originalWallColor, [10, 3, 0], Math.PI/2);

        // 地毯区域 (正常状态不明显，异空间变成红色)
        const carpetGeo = new THREE.BoxGeometry(12, 0.05, 18);
        carpetMaterial = new THREE.MeshStandardMaterial({ color: 0xaa8866, roughness: 0.9 });
        const carpet = new THREE.Mesh(carpetGeo, carpetMaterial);
        carpet.position.set(0, 0.03, -2);
        carpet.receiveShadow = true;
        scene.add(carpet);

        // --- 画作 (可点击) ---
        function createPainting(width, height, color, position, rotationY = 0) {
            const frameGeo = new THREE.BoxGeometry(width + 0.2, height + 0.2, 0.1);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: 0.5 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.set(position[0], position[1], position[2]);
            frame.rotation.y = rotationY;
            frame.castShadow = true;
            frame.receiveShadow = true;
            scene.add(frame);

            const canvasGeo = new THREE.BoxGeometry(width, height, 0.05);
            const canvasMat = new THREE.MeshStandardMaterial({ color: color, emissive: new THREE.Color(0x222222) });
            const canvas = new THREE.Mesh(canvasGeo, canvasMat);
            canvas.position.set(position[0], position[1], position[2] + 0.06);
            canvas.rotation.y = rotationY;
            canvas.castShadow = true;
            canvas.receiveShadow = true;
            scene.add(canvas);
            
            paintingMeshes.push(canvas);
            paintingMeshes.push(frame);
            
            const borderGeo = new THREE.BoxGeometry(width + 0.3, height + 0.3, 0.08);
            const borderMat = new THREE.MeshStandardMaterial({ color: 0xcdb38c });
            const border = new THREE.Mesh(borderGeo, borderMat);
            border.position.set(position[0], position[1], position[2] - 0.03);
            border.rotation.y = rotationY;
            border.castShadow = true;
            scene.add(border);

            canvas.userData.isPainting = true;
            frame.userData.isPainting = true;
            border.userData.isPainting = true;

            return canvas;
        }

        // 挂画
        createPainting(2.5, 2, 0x3a6ea5, [0, 3, -14.8], 0);
        createPainting(1.8, 2.2, 0x8b5a2b, [-4.5, 3, -14.8], 0);
        createPainting(1.8, 2.2, 0x5a8b5a, [4.5, 3, -14.8], 0);
        createPainting(2.2, 1.8, 0x9b6b9b, [-9.8, 3, -6], Math.PI/2);
        createPainting(2.2, 1.8, 0xb87c4b, [-9.8, 3, 2], Math.PI/2);
        createPainting(2.2, 1.8, 0x4b7cb8, [9.8, 3, -6], -Math.PI/2);
        createPainting(2.2, 1.8, 0x7c4bb8, [9.8, 3, 2], -Math.PI/2);

        // --- 前台和人物 (正常状态下可见) ---
        const normalGroup = new THREE.Group();
        scene.add(normalGroup);

        // 前台桌子
        const deskGeo = new THREE.BoxGeometry(2.5, 1.2, 1.2);
        const deskMat = new THREE.MeshStandardMaterial({ color: 0xc9b18b, roughness: 0.5 });
        const desk = new THREE.Mesh(deskGeo, deskMat);
        desk.position.set(0, 0.6, -7);
        desk.castShadow = true;
        desk.receiveShadow = true;
        normalGroup.add(desk);

        const deskTopGeo = new THREE.BoxGeometry(2.7, 0.1, 1.4);
        const deskTopMat = new THREE.MeshStandardMaterial({ color: 0x8b6b4b, roughness: 0.3 });
        const deskTop = new THREE.Mesh(deskTopGeo, deskTopMat);
        deskTop.position.set(0, 1.2, -7);
        deskTop.castShadow = true;
        deskTop.receiveShadow = true;
        normalGroup.add(deskTop);

        const monitorGeo = new THREE.BoxGeometry(0.6, 0.4, 0.1);
        const monitorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const monitor = new THREE.Mesh(monitorGeo, monitorMat);
        monitor.position.set(-0.8, 1.5, -7.2);
        monitor.castShadow = true;
        normalGroup.add(monitor);

        // 人物
        const personGroup = new THREE.Group();
        personGroup.position.set(0.6, 0, -7.5);

        const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.1, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a6b8a });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.55;
        body.castShadow = true;
        body.receiveShadow = true;
        personGroup.add(body);

        const headGeo = new THREE.SphereGeometry(0.25, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffddbb });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.25;
        head.castShadow = true;
        head.receiveShadow = true;
        personGroup.add(head);

        const eyeGeo = new THREE.SphereGeometry(0.05, 8, 8);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.1, 1.3, 0.2);
        personGroup.add(leftEye);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.1, 1.3, 0.2);
        personGroup.add(rightEye);

        const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.7, 6);
        const armMat = new THREE.MeshStandardMaterial({ color: 0x4a6b8a });
        const leftArm = new THREE.Mesh(armGeo, armMat);
        leftArm.position.set(-0.5, 0.8, 0);
        leftArm.rotation.z = 0.3;
        leftArm.castShadow = true;
        personGroup.add(leftArm);
        const rightArm = new THREE.Mesh(armGeo, armMat);
        rightArm.position.set(0.5, 0.8, 0);
        rightArm.rotation.z = -0.3;
        rightArm.castShadow = true;
        personGroup.add(rightArm);

        normalGroup.add(personGroup);

        // CSS标签
        const labelDiv = document.createElement('div');
        labelDiv.textContent = '👤 前台';
        labelDiv.style.color = 'white';
        labelDiv.style.backgroundColor = 'rgba(0,0,0,0.7)';
        labelDiv.style.padding = '4px 12px';
        labelDiv.style.borderRadius = '20px';
        labelDiv.style.fontSize = '14px';
        labelDiv.style.border = '1px solid rgba(255,255,255,0.3)';
        labelDiv.style.backdropFilter = 'blur(4px)';
        const labelObj = new CSS2DObject(labelDiv);
        labelObj.position.set(0.6, 2.2, -7.5);
        normalGroup.add(labelObj);

        // 柱子
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4 });
        const pillarGeo = new THREE.CylinderGeometry(0.3, 0.35, 6, 12);
        const positions = [[-8, 3, -10], [8, 3, -10], [-8, 3, 10], [8, 3, 10]];
        positions.forEach(pos => {
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            pillar.position.set(pos[0], pos[1], pos[2]);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            scene.add(pillar);
        });

        // 射灯
        const spotMat = new THREE.MeshStandardMaterial({ color: 0xffeedd, emissive: new THREE.Color(0xffaa66) });
        const spotGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.1, 8);
        for (let i = -1; i <= 1; i+=2) {
            for (let j = -1; j <= 1; j+=2) {
                const spot = new THREE.Mesh(spotGeo, spotMat);
                spot.position.set(i*5, 5.8, j*5);
                spot.receiveShadow = true;
                scene.add(spot);
            }
        }

        // --- 异空间元素 (初始隐藏) ---
        const alternateGroup = new THREE.Group();
        alternateGroup.visible = false;
        scene.add(alternateGroup);

        const redCarpetGeo = new THREE.BoxGeometry(14, 0.1, 22);
        const redCarpetMat = new THREE.MeshStandardMaterial({ color: 0x8b1a1a, roughness: 0.8 });
        const redCarpet = new THREE.Mesh(redCarpetGeo, redCarpetMat);
        redCarpet.position.set(0, 0.08, -2);
        redCarpet.receiveShadow = true;
        alternateGroup.add(redCarpet);

        // --- 交互: 点击画作穿越 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onClick(event) {
            // 忽略在移动按键上的点击？不处理，直接射线检测
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(paintingMeshes, true);
            
            if (intersects.length > 0) {
                toggleSpace();
            }
        }

        function toggleSpace() {
            isTransformed = !isTransformed;
            
            // 墙壁变色: 正常白色 vs 深绿色
            wallMeshes.forEach(wall => {
                if (isTransformed) {
                    wall.material.color.setHex(darkGreenColor);
                } else {
                    wall.material.color.setHex(originalWallColor);
                }
            });

            // 地毯和地板
            if (isTransformed) {
                carpetMaterial.color.setHex(redColor);
                floorMaterial.color.setHex(0x2a2a2a);
            } else {
                carpetMaterial.color.setHex(0xaa8866);
                floorMaterial.color.setHex(0xd9c8a9);
            }

            normalGroup.visible = !isTransformed;
            alternateGroup.visible = isTransformed;

            const infoDiv = document.getElementById('info');
            const hintDiv = document.getElementById('hint');
            if (isTransformed) {
                infoDiv.innerHTML = '🌿 深绿异空间 · 空无一人';
                infoDiv.style.background = 'rgba(10,30,10,0.8)';
                hintDiv.innerHTML = '🖱️ 点击画作返回';
                ambientLight.intensity = 0.3;
                dirLight.intensity = 0.6;
                scene.background.setHex(0x0a1a0a);
            } else {
                infoDiv.innerHTML = '🏛️ 正常美术馆 · 前台有人';
                infoDiv.style.background = 'rgba(0,0,0,0.6)';
                hintDiv.innerHTML = '🖱️ 点击画作穿越';
                ambientLight.intensity = 0.5;
                dirLight.intensity = 1.2;
                scene.background.setHex(0x111122);
            }
        }

        renderer.domElement.addEventListener('click', onClick);

        // --- 移动控制 (WASD / 方向键) ---
        const keyState = {
            w: false, a: false, s: false, d: false,
            arrowup: false, arrowleft: false, arrowdown: false, arrowright: false
        };

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'arrowup') {
                keyState.w = true;
                e.preventDefault();
            } else if (key === 's' || key === 'arrowdown') {
                keyState.s = true;
                e.preventDefault();
            } else if (key === 'a' || key === 'arrowleft') {
                keyState.a = true;
                e.preventDefault();
            } else if (key === 'd' || key === 'arrowright') {
                keyState.d = true;
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'arrowup') {
                keyState.w = false;
                e.preventDefault();
            } else if (key === 's' || key === 'arrowdown') {
                keyState.s = false;
                e.preventDefault();
            } else if (key === 'a' || key === 'arrowleft') {
                keyState.a = false;
                e.preventDefault();
            } else if (key === 'd' || key === 'arrowright') {
                keyState.d = false;
                e.preventDefault();
            }
        });

        // 移动速度
        const moveSpeed = 0.12;
        // 用于镜头晃动（走动效果）
        let walkTimer = 0;

        // 限制移动范围（美术馆内部）
        const bounds = {
            minX: -9.5,
            maxX: 9.5,
            minZ: -14.5,
            maxZ: 14.5
        };

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);

            // 处理移动
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0;
            forward.normalize();
            
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0;
            right.normalize();

            const moveDelta = new THREE.Vector3(0, 0, 0);
            
            if (keyState.w || keyState.arrowup) {
                moveDelta.add(forward.clone().multiplyScalar(moveSpeed));
            }
            if (keyState.s || keyState.arrowdown) {
                moveDelta.add(forward.clone().multiplyScalar(-moveSpeed));
            }
            if (keyState.a || keyState.arrowleft) {
                moveDelta.add(right.clone().multiplyScalar(-moveSpeed));
            }
            if (keyState.d || keyState.arrowright) {
                moveDelta.add(right.clone().multiplyScalar(moveSpeed));
            }

            if (moveDelta.length() > 0.0001) {
                // 应用移动
                camera.position.x += moveDelta.x;
                camera.position.z += moveDelta.z;
                
                // 边界限制
                camera.position.x = Math.max(bounds.minX, Math.min(bounds.maxX, camera.position.x));
                camera.position.z = Math.max(bounds.minZ, Math.min(bounds.maxZ, camera.position.z));
                
                // 走动效果：轻微上下浮动 + 轻微左右摇摆 (通过调整camera的y和rotation)
                walkTimer += 0.15;
                const bobAmount = Math.sin(walkTimer * 2) * 0.03; // 上下浮动
                const swayAmount = Math.sin(walkTimer * 1.7) * 0.01; // 左右摇摆 (rotation.z)
                
                // 保持基础高度1.7，加上浮动
                camera.position.y = 1.7 + bobAmount;
                // 轻微摇摆
                camera.rotation.z = swayAmount;
            } else {
                // 没有移动时，平滑回到正常高度和姿态
                camera.position.y += (1.7 - camera.position.y) * 0.15;
                camera.rotation.z += (0 - camera.rotation.z) * 0.15;
                // 逐渐重置walkTimer
                walkTimer *= 0.9;
            }

            // 更新控制器的target使其跟随相机前方，保持第一视角
            // 这样可以避免OrbitControls把相机拉向target
            const targetOffset = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            controls.target.copy(camera.position).add(targetOffset);
            
            // 阻尼效果更新
            controls.update();

            // 渲染
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        animate();

        // 窗口大小自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('美术馆已加载。WASD移动，点击画作穿越。深绿色异界等你探索。');
    </script>
</body>
  </html>
